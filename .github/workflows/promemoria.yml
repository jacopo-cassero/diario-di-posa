name: Promemoria del mattino

on:
  schedule:
    - cron: '7 * * * *'   # ogni ora: manda i promemoria agli orari scelti nell'app (GitHub può ritardare qualche minuto)
  workflow_dispatch:
    inputs:
      prova:
        description: 'Manda subito una notifica di prova'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  promemoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - name: Calcola e invia le notifiche
        run: node scripts/promemoria.mjs ${{ inputs.prova && '--prova' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      # Salva l'esito (senza chiavi) quando qualcosa non va, o una volta al mese.
      # Il salvataggio mensile tiene attivo il controllo: GitHub sospende quelli
      # programmati dopo 60 giorni senza modifiche al progetto.
      - name: Salva l'esito
        if: always() && (failure() || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "diario-di-posa"
          git config user.email "actions@users.noreply.github.com"
          git add .github/stato-promemoria.txt 2>/dev/null || true
          git commit -m "Esito controllo notifiche" && git pull --rebase -q && git push || true
      - name: Mantieni attivo il controllo
        if: success() && github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0103" ]; then
            git config user.name "diario-di-posa"
            git config user.email "actions@users.noreply.github.com"
            git add .github/stato-promemoria.txt
            git commit -m "Controllo mensile" && git pull --rebase -q && git push
          fi
